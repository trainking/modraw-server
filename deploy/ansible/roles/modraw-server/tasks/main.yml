# modraw-server deployment tasks
# Assumes the Go binary has been pre-built locally (see deploy/build.sh).

- name: Ensure app system group exists
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: yes

- name: Ensure app system user exists
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: yes
    create_home: no
    shell: /usr/sbin/nologin

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_path }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Create migrations directory
  ansible.builtin.file:
    path: "{{ app_path }}/migrations"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Upload application binary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../bin/{{ binary_name }}"
    dest: "{{ app_path }}/{{ binary_name }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Upload migration files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../migrations/"
    dest: "{{ app_path }}/migrations"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"

- name: Deploy environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_path }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"
  notify: Restart modraw-server

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: modraw-server.service.j2
    dest: "/etc/systemd/system/{{ binary_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart modraw-server

- name: Ensure modraw-server service is running
  ansible.builtin.systemd:
    name: "{{ binary_name }}"
    state: started
    enabled: yes
    daemon_reload: yes

# --- Nginx ---

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes

- name: Deploy Nginx site configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "/etc/nginx/sites-available/{{ binary_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Enable Nginx site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ binary_name }}"
    dest: "/etc/nginx/sites-enabled/{{ binary_name }}"
    state: link
  notify: Reload Nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Ensure Nginx is running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: yes
