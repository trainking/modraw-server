# PostgreSQL setup tasks
# Installs PostgreSQL, creates a user and database for modraw-server.

- name: Install required system packages
  ansible.builtin.apt:
    name:
      - gnupg
      - wget
      - ca-certificates
    state: present
    update_cache: yes

- name: Add PostgreSQL APT repository key
  ansible.builtin.apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Add PostgreSQL APT repository
  ansible.builtin.apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    update_cache: yes

- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - "postgresql-{{ pg_version }}"
      - "postgresql-client-{{ pg_version }}"
      - python3-psycopg2
    state: present

- name: Ensure PostgreSQL is running
  ansible.builtin.systemd:
    name: "postgresql"
    state: started
    enabled: yes

- name: Wait for PostgreSQL to accept connections
  ansible.builtin.wait_for:
    path: /var/run/postgresql/.s.PGSQL.5432
    state: present
    timeout: 10

- name: Create PostgreSQL database user
  become: yes
  become_user: postgres
  postgresql_user:
    name: "{{ pg_user }}"
    password: "{{ hostvars['localhost'].deploy.PG_PASSWORD }}"
    encrypted: yes
    state: present

- name: Create PostgreSQL database
  become: yes
  become_user: postgres
  postgresql_db:
    name: "{{ pg_database }}"
    owner: "{{ pg_user }}"
    encoding: UTF-8
    state: present

- name: Enable uuid-ossp extension
  become: yes
  become_user: postgres
  postgresql_ext:
    name: uuid-ossp
    db: "{{ pg_database }}"
    state: present

- name: Grant schema permissions to user
  become: yes
  become_user: postgres
  postgresql_privs:
    db: "{{ pg_database }}"
    privs: ALL
    type: schema
    obj: public
    role: "{{ pg_user }}"
