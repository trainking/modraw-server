# Ansible configuration for modraw-server deployment

[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
stdout_callback = yaml
retry_files_enabled = False
gathering = smart
fact_caching_timeout = 3600

# Prompt for vault password (encrypt sensitive vars like pg_password, jwt_secret)
# vault_password_file = .vault_pass

[ssh_connection]
pipelining = True
